[project]
name = "nflfp"
version = "0.1.0"
description = "Opponent-adjusted expected fantasy points per player"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26"]

[project.scripts]
nflfp = "nflfp.__main__:main"

[dependency-groups]
analysis = [
    "scikit-learn>=1.9.1",
]
dev = ["pytest>=8"]
graphics = ["pillow>=10.1"]

[tool.uv]
default-groups = ["dev", "graphics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nflfp"]
